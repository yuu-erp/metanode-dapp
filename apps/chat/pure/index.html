<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat — Manual test theo domain</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f4f5;
        color: #18181b;
      }

      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      .page-header h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
      }

      .page-header p {
        margin: 0 0 1.5rem;
        color: #52525b;
        font-size: 0.95rem;
      }

      .layout {
        display: grid;
        gap: 1.25rem;
      }

      @media (min-width: 900px) {
        .layout {
          grid-template-columns: 240px 1fr;
          align-items: start;
        }
      }

      nav {
        position: sticky;
        top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.75rem;
        border-radius: 0.75rem;
        background: #fff;
        border: 1px solid #e4e4e7;
      }

      .domain-nav-link {
        font-size: 0.8125rem;
        color: #2563eb;
        text-decoration: none;
        padding: 0.25rem 0.35rem;
        border-radius: 0.35rem;
      }

      .domain-nav-link:hover {
        background: #eff6ff;
      }

      #domains {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .domain-panel {
        scroll-margin-top: 1rem;
        padding: 1.25rem 1.5rem;
        border-radius: 0.75rem;
        background: #fff;
        border: 1px solid #e4e4e7;
      }

      .domain-title {
        margin: 0 0 0.35rem;
        font-size: 1.125rem;
      }

      .domain-desc {
        margin: 0 0 1rem;
        color: #71717a;
        font-size: 0.875rem;
      }

      .domain-body {
        min-height: 4rem;
        padding: 1rem;
        border-radius: 0.5rem;
        border: 1px dashed #d4d4d8;
        color: #a1a1aa;
        font-size: 0.875rem;
        text-align: center;
      }

      .domain-body-filled {
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .sdk-status {
        margin: 0 0 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        background: #eff6ff;
        color: #1e40af;
        font-size: 0.8125rem;
      }

      .field-label {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .field-hint {
        margin: 0;
        font-size: 0.8125rem;
        color: #71717a;
      }

      .field-input {
        width: 100%;
        padding: 0.5rem 0.65rem;
        border: 1px solid #d4d4d8;
        border-radius: 0.5rem;
        font-size: 0.875rem;
      }

      textarea.field-input {
        resize: vertical;
        min-height: 4.5rem;
        font-family: inherit;
      }

      .btn-primary {
        align-self: flex-start;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result-log {
        margin: 0;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background: #fafafa;
        border: 1px solid #e4e4e7;
        font-size: 0.75rem;
        overflow: auto;
        max-height: 240px;
        white-space: pre-wrap;
      }

      .e2e-banner {
        margin: 0 0 1.25rem;
        padding: 1rem 1.25rem;
        border-radius: 0.75rem;
        background: #fffbeb;
        border: 1px solid #fde68a;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .e2e-summary {
        margin: 0;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .e2e-steps {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-height: 320px;
        overflow: auto;
      }

      .e2e-step {
        padding: 0.5rem 0.65rem;
        border-radius: 0.45rem;
        border: 1px solid #e4e4e7;
        background: #fff;
        font-size: 0.8125rem;
      }

      .e2e-step-pass {
        border-color: #86efac;
        background: #f0fdf4;
      }

      .e2e-step-fail {
        border-color: #fca5a5;
        background: #fef2f2;
      }

      .e2e-step-skip {
        border-color: #d4d4d8;
        background: #fafafa;
        opacity: 0.85;
      }

      .e2e-step-running {
        border-color: #93c5fd;
        background: #eff6ff;
      }

      .e2e-step-head {
        font-weight: 600;
      }

      .e2e-step-error {
        margin: 0.35rem 0 0;
        padding: 0.5rem;
        font-size: 0.7rem;
        background: #18181b;
        color: #fafafa;
        border-radius: 0.35rem;
        overflow: auto;
        max-height: 140px;
      }

      .e2e-step-detail {
        margin: 0.35rem 0 0;
        font-size: 0.65rem;
        opacity: 0.85;
        max-height: 80px;
        overflow: auto;
      }

      .e2e-full-log {
        max-height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Manual test — 19 domain</h1>
        <p>Manual test theo domain — tái sử dụng logic từ <code>apps/chat/src</code>.</p>
        <p id="sdk-status" class="sdk-status" aria-live="polite">Đang khởi tạo…</p>
        <div id="pure-e2e-banner" aria-label="Full E2E runner"></div>
      </header>

      <div class="layout">
        <nav id="domain-nav" aria-label="Danh sách domain"></nav>
        <main id="domains" aria-label="Vùng test theo domain"></main>
      </div>
    </div>

    <script type="module" src="./entry.js"></script>
  </body>
</html>
