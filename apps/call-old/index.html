<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-tsrouter-app" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Metanode First Login</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module">
      function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent
        )
      }

      function loadScriptOnce(src) {
        if (!document.querySelector(`script[src="${src}"]`)) {
          const s = document.createElement('script')
          s.src = src
          document.head.appendChild(s)
        }
      }

      function loadCSSOnce(href) {
        if (!document.querySelector(`link[href="${href}"]`)) {
          const l = document.createElement('link')
          l.rel = 'stylesheet'
          l.href = href
          document.head.appendChild(l)
        }
      }

      if (isMobile()) {
        console.log('Đang chạy trên điện thoại')
      } else {
        loadScriptOnce('https://a.ibe.app:8000/mtn-virtual-lib/js/fileDbHelper.js')
        loadScriptOnce('https://a.ibe.app:8000/mtn-virtual-lib/js/exe_controller.js')
        loadScriptOnce('https://a.ibe.app:8000/mtn-virtual-lib/js/storage_controller.js')
        loadScriptOnce('https://a.ibe.app:8000/mtn-virtual-lib/js/file_controller.js')
        loadScriptOnce('https://a.ibe.app:8000/mtn-virtual-lib/js/finsdk.js')
        loadCSSOnce('https://a.ibe.app:8000/mtn-virtual-lib/css/index.css')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
